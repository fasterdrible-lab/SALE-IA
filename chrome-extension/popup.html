<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SALEIA — Assistente de Vendas</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <div class="popup-header">
      <span class="popup-logo">🤖</span>
      <div>
        <div class="popup-title">SALEIA</div>
        <div class="popup-subtitle">Assistente de Vendas IA</div>
      </div>
      <label class="popup-toggle" title="Ligar/desligar a API">
        <input type="checkbox" id="toggle-ativo" checked />
        <span class="popup-toggle-slider"></span>
      </label>
    </div>

    <!-- Status da API (ligada/desligada) -->
    <div id="api-toggle-feedback" class="popup-api-toggle-status"></div>

    <!-- Conta (login opcional) -->
    <div class="popup-secao">
      <div class="popup-secao-titulo">Conta</div>
      <div id="popup-login-form">
        <input type="email" id="login-email" class="popup-login-input" placeholder="E-mail" autocomplete="username" />
        <input type="password" id="login-senha" class="popup-login-input" placeholder="Senha" autocomplete="current-password" />
        <button type="button" id="btn-login" class="popup-login-btn">Entrar</button>
        <div id="login-feedback" class="popup-feedback"></div>
      </div>
      <div id="popup-login-logado" class="popup-login-logado" style="display:none">
        <span id="login-usuario-nome"></span>
        <button type="button" id="btn-logout" class="popup-logout-link">Sair</button>
      </div>
    </div>

    <!-- Status da reunião -->
    <div id="popup-status" class="popup-status popup-status-aguardando">
      <span class="status-dot"></span>
      <span id="status-texto">Aguardando Google Meet...</span>
    </div>

    <!-- Últimas dicas -->
    <div class="popup-secao">
      <div class="popup-secao-titulo">📋 Últimas dicas recebidas</div>
      <div id="ultimas-dicas" class="popup-dicas-vazio">
        Nenhuma dica ainda. Entre em uma reunião no Google Meet e ative as legendas (CC).
      </div>
    </div>

    <!-- Conexão com o backend -->
    <div class="popup-secao">
      <div class="popup-secao-titulo">Conexão</div>
      <span id="conexao-status" class="popup-conexao popup-conexao-conectando">Conectando...</span>
    </div>

    <!-- Rodapé -->
    <div class="popup-footer">
      <span id="versao">v1.4.1</span>
      <span>·</span>
      <a id="btn-relatorio" href="#" class="popup-link">Ver relatório completo</a>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
