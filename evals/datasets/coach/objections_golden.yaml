# Golden Dataset — Coach Agent (TAREFA 2.2/2.3 do PROMPT MESTRE)
#
# ATENCAO — dados sinteticos, nao reais:
# O prompt mestre pede "reunioes reais anonimizadas". Esta sessao nao tem
# acesso ao MySQL de producao (sem SSH/credenciais neste ambiente), entao
# os 22 casos abaixo (2 por categoria) sao FRASES SINTETICAS escritas a
# mao para cobrir as 11 categorias minimas — nao vieram de reunioes reais.
# Servem para validar a mecanica do harness (schema, assertions, CI).
# Antes de usar isto para decidir sobre qualidade de prompt em producao,
# alguem com acesso ao banco deve substituir/expandir por trechos reais
# anonimizados (meta do prompt mestre: minimo 50, depois 200+).
#
# Cada caso roda contra coach_v1 (evals/providers/coach_provider.py, que
# chama agent.multiagente.coach_agent.analisar_coach de verdade — custo
# real de IA por execucao).

- description: "PRICE_VALUE 1 — objecao direta de valor mensal"
  vars:
    transcricao: "Cliente: Sinceramente, achei o valor mensal bem alto pra esse tipo de solucao."
  assert:
    - type: is-json
    - type: not-contains
      value: "desconto"
  metadata:
    objection_type: PRICE_VALUE

- description: "PRICE_VALUE 2 — duvida se compensa o preco"
  vars:
    transcricao: "Cliente: Nao sei se compensa pagar tanto por mes nisso, pra ser sincero."
  assert:
    - type: is-json
    - type: not-contains
      value: "desconto"
  metadata:
    objection_type: PRICE_VALUE

- description: "CASH_FLOW 1 — caixa apertado"
  vars:
    transcricao: "Cliente: Agora nosso caixa ta bem apertado, nao sobra muito no fim do mes."
  assert:
    - type: is-json
  metadata:
    objection_type: CASH_FLOW

- description: "CASH_FLOW 2 — fluxo de caixa travado"
  vars:
    transcricao: "Cliente: A gente ta com o fluxo de caixa meio travado esse trimestre."
  assert:
    - type: is-json
  metadata:
    objection_type: CASH_FLOW

- description: "ROI_RISK 1 — medo de nao ter retorno"
  vars:
    transcricao: "Cliente: E se isso nao trouxer o retorno que voces prometem? Fico com receio."
  assert:
    - type: is-json
  metadata:
    objection_type: ROI_RISK

- description: "ROI_RISK 2 — medo de investir sem resultado"
  vars:
    transcricao: "Cliente: Tenho medo de investir nisso e nao ver resultado nenhum depois."
  assert:
    - type: is-json
  metadata:
    objection_type: ROI_RISK

- description: "DECISION_MAKER 1 — exemplo literal do PROMPT MESTRE (TAREFA 2.4)"
  vars:
    transcricao: "Cliente: Preciso conversar com meu socio antes de fechar qualquer coisa."
  assert:
    - type: is-json
    - type: not-contains
      value: "desconto"
    - type: javascript
      value: |
        const data = JSON.parse(output);
        const nba = data.next_best_action || {};
        const texto = `${nba.category || ""} ${nba.message || ""} ${nba.objective || ""}`.toLowerCase();
        return texto.includes("decisor") || texto.includes("socio") || texto.includes("autoridade");
  metadata:
    objection_type: DECISION_MAKER
    expected_bad_behavior: "nao oferecer desconto; nao pressionar fechamento"

- description: "DECISION_MAKER 2 — diretor financeiro decide"
  vars:
    transcricao: "Cliente: Isso passa pelo meu diretor financeiro, eu nao decido sozinho aqui."
  assert:
    - type: is-json
    - type: not-contains
      value: "desconto"
  metadata:
    objection_type: DECISION_MAKER

- description: "TIMING 1 — adiar para o ano que vem"
  vars:
    transcricao: "Cliente: Talvez seja melhor a gente conversar de novo so ano que vem."
  assert:
    - type: is-json
  metadata:
    objection_type: TIMING

- description: "TIMING 2 — nao e prioridade agora"
  vars:
    transcricao: "Cliente: Isso nao e uma prioridade agora pra gente, so daqui uns meses."
  assert:
    - type: is-json
  metadata:
    objection_type: TIMING

- description: "COMPETITION 1 — avaliando outro fornecedor"
  vars:
    transcricao: "Cliente: Estamos tambem olhando uma proposta de outro fornecedor concorrente."
  assert:
    - type: is-json
  metadata:
    objection_type: COMPETITION

- description: "COMPETITION 2 — concorrente com preco menor"
  vars:
    transcricao: "Cliente: O concorrente de voces ofereceu um preco bem menor pra gente."
  assert:
    - type: is-json
  metadata:
    objection_type: COMPETITION

- description: "TRUST 1 — duvida se funciona pra empresa dele"
  vars:
    transcricao: "Cliente: Como eu sei que isso realmente funciona pra uma empresa como a minha?"
  assert:
    - type: is-json
  metadata:
    objection_type: TRUST

- description: "TRUST 2 — experiencia ruim anterior"
  vars:
    transcricao: "Cliente: Ja fui mal atendido por outra empresa parecida antes, fiquei com pe atras."
  assert:
    - type: is-json
  metadata:
    objection_type: TRUST

- description: "FIT 1 — duvida se serve pro negocio"
  vars:
    transcricao: "Cliente: Nao sei se isso serve pro nosso tipo de negocio, e bem diferente."
  assert:
    - type: is-json
  metadata:
    objection_type: FIT

- description: "FIT 2 — caso especifico demais"
  vars:
    transcricao: "Cliente: Nosso caso e bem especifico, duvido que isso resolva pra gente."
  assert:
    - type: is-json
  metadata:
    objection_type: FIT

- description: "IMPLEMENTATION 1 — tempo de implantacao"
  vars:
    transcricao: "Cliente: Quanto tempo leva pra implementar isso na pratica aqui dentro?"
  assert:
    - type: is-json
  metadata:
    objection_type: IMPLEMENTATION

- description: "IMPLEMENTATION 2 — medo da equipe nao usar"
  vars:
    transcricao: "Cliente: Tenho medo da minha equipe nao conseguir usar direito isso depois."
  assert:
    - type: is-json
  metadata:
    objection_type: IMPLEMENTATION

- description: "CONTRACT 1 — prazo de fidelidade"
  vars:
    transcricao: "Cliente: Qual o prazo de fidelidade desse contrato? Tem multa de cancelamento?"
  assert:
    - type: is-json
  metadata:
    objection_type: CONTRACT

- description: "CONTRACT 2 — cancelamento a qualquer momento"
  vars:
    transcricao: "Cliente: Eu consigo cancelar quando quiser ou fico preso no contrato?"
  assert:
    - type: is-json
  metadata:
    objection_type: CONTRACT

- description: "OTHER 1 — vou pensar e retorno"
  vars:
    transcricao: "Cliente: Deixa eu pensar com calma sobre isso e eu te retorno depois."
  assert:
    - type: is-json
  metadata:
    objection_type: OTHER

- description: "OTHER 2 — precisa alinhar internamente"
  vars:
    transcricao: "Cliente: Preciso alinhar isso internamente antes de qualquer decisao."
  assert:
    - type: is-json
  metadata:
    objection_type: OTHER
