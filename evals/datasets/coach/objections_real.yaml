# Golden Dataset — Coach Agent, REUNIOES REAIS ANONIMIZADAS (TAREFA 2.2)
#
# Substitui os 22 casos sinteticos de objections_golden.yaml (removido).
# Fonte: tabela `sales_memories` de producao (memory_type='objection'),
# 34 registros — TODOS os que existiam no banco em 05/09/2026, puxados
# via SSH read-only e nunca gravados em nenhum arquivo do repo em forma
# bruta.
#
# IMPORTANTE — o que "real" significa aqui:
# O conteudo original em `sales_memories.content` ja e um RESUMO gerado
# pela IA (agent/sales_memory.py::salvar_memoria), nao a transcricao
# verbatim da reuniao — decisao deliberada desta sessao (ver conversa),
# escolhida por reduzir risco de privacidade (o resumo ja e uma sintese
# de "o que aconteceu", nao a fala crua do cliente). Cada caso abaixo foi
# REESCRITO manualmente como uma fala em primeira pessoa ("Cliente: ...")
# que captura a mesma objecao/situacao real, removendo:
# - nomes proprios de clientes (apareciam 2 vezes no dataset original)
#   — nunca usados aqui;
# - qualquer referencia que pudesse identificar uma empresa especifica
#   (nomes de empresa, RH nem cargo peculiar).
# Valores monetarios genericos (faixas de preco comuns, tipo "1000 a
# 1500 por mes") foram mantidos por nao serem identificadores por si so
# e serem uteis pro realismo da categoria PRICE_VALUE/CASH_FLOW; valores
# muito especificos e raros (ex.: "R$150 mil em CDB") foram generalizados.
#
# `memoria_id` no metadata referencia o id (UUID) da linha original em
# sales_memories — util pra rastreabilidade interna, nao e informacao
# de cliente.
#
# Distribuicao real por categoria (nao e uniforme, e a distribuicao real
# de objecoes do negocio): CASH_FLOW domina (9), FIT nao aparece nenhuma
# vez — ver evals/datasets/coach/objections_fit_gap.yaml pros 2 casos
# sinteticos que cobrem essa lacuna especifica.
#
# Todos os casos rodam contra coach_v1 (evals/providers/coach_provider.py).

- description: "IMPLEMENTATION — trava em duvida sobre logistica/estoque"
  vars:
    transcricao: "Cliente: Minha maior duvida e como eu vou lidar com estoque e armazenagem disso, nunca mexi com produto fisico."
  assert:
    - type: is-json
  metadata:
    objection_type: IMPLEMENTATION
    fonte: sales_memories
    memoria_id: "2b62ff55-9244-4e80-9595-259ac775b395"

- description: "PRICE_VALUE — objecao ao valor do plano principal"
  vars:
    transcricao: "Cliente: Gostei bastante do projeto, mas o valor do plano principal ta acima do que eu tinha em mente, eu imaginava algo entre 1000 e 1500 por mes."
  assert:
    - type: is-json
    - type: llm-rubric
      value: "A resposta nao recomenda que o vendedor ofereca desconto ao cliente agora. Se o texto disser explicitamente para NAO oferecer desconto (ex.: numa dica pro vendedor), isso conta como PASSANDO na regra — o problema seria so recomendar dar o desconto."
  metadata:
    objection_type: PRICE_VALUE
    fonte: sales_memories
    memoria_id: "ef4317e9-4a5d-4901-9c53-3acd4d74e087"

- description: "DECISION_MAKER — precisa validar parceria externa antes"
