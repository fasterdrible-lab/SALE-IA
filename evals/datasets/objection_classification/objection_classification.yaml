# Conjunto de classificação de objeções — Tarefa D3 de
# docs/tasks-prompt-mestre-v2-restante.md (objection classification
# 75% → 90%). Versão v1.0.0 (02/10/2026).
#
# Por que existe: o Golden Sales Dataset tem só 4 objeções
# (objections.yaml) — 1 erro já vira 75%, amostra pequena demais para um
# critério de ≥ 90%. Aqui cada caso é só (fala da objeção → categoria
# esperada), nos 13 tipos de agent/objection_rules.py::OBJECTION_TIPOS,
# a mesma tarefa do classificador em produção
# (agent/objection_category_classifier.py).
#
# Rótulos dados À MÃO nesta rodada (revisáveis). Regra do rótulo: a
# categoria do que o cliente DISSE, nunca a causa raiz suposta.
#
# Fontes:
# - `real_anonimizado`: 17 falas de evals/datasets/coach/objections_real.yaml
#   (objeções reais de produção, já anonimizadas), reetiquetadas nos 13
#   tipos. Só entraram as de rótulo inequívoco — as ambíguas (ex.: "levar
#   pro conselho e passar pelo jurídico" = AUTHORITY ou LEGAL; "risco de
#   ROI") ficaram de fora em vez de forçar um rótulo.
# - `sintetico`: 13 falas escritas para cobrir os tipos que não aparecem
#   nos dados reais (ADOPTION, PRIORITY, PROCUREMENT, SECURITY, AUTHORITY)
#   e reforçar VALUE/COMPETITOR/TIMING.

